<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance s Honzou – generátor postů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600&family=Stack+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F8; --ink:#16171A; --paper:#FFFFFF; --line:#D5D6DA; --line-strong:#9A9CA3;
  --muted:#6B6E76; --stage:#ECEDEF; --accent:#16171A; --on-accent:#FFFFFF; --warn-bg:#FFF4D6; --warn-ink:#6A4A00;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --ink:#ECEDEF; --paper:#1C1D21; --line:#34363C; --line-strong:#5A5D66;
    --muted:#9A9DA6; --stage:#18191C; --accent:#ECEDEF; --on-accent:#121316; --warn-bg:#3A2F12; --warn-ink:#FFE6A3;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --ink:#ECEDEF; --paper:#1C1D21; --line:#34363C; --line-strong:#5A5D66;
  --muted:#9A9DA6; --stage:#18191C; --accent:#ECEDEF; --on-accent:#121316; --warn-bg:#3A2F12; --warn-ink:#FFE6A3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

.top{display:flex;align-items:center;gap:16px;padding:22px 32px 4px}
.top .logo{height:46px;width:auto;flex:none;display:block}
.top h1{margin:0;font-size:20px;font-weight:600}
.top h1{padding-left:16px;border-left:1px solid var(--line)}

.app{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:32px;padding:20px 32px 48px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--stage);border-radius:12px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage canvas{display:block;width:auto;height:min(calc(100vh - 170px),900px);max-width:100%;aspect-ratio:1080/1350;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);background:#F5F5F5}
.stage .meta{margin:0;font-size:13px;color:var(--muted);text-align:center;max-width:460px}
.view{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.view[hidden]{display:none}
.viewseg{display:flex;padding:3px;background:var(--bg);border-radius:9px;align-self:center}
.viewseg button{font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
.viewseg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.phone{width:min(440px,100%);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:#E9EAEC}
.tile img,.tile canvas{display:block;width:100%;height:100%;object-fit:cover}
.tile.live::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #3B82F6;pointer-events:none}
.tile .tools{position:absolute;right:4px;top:4px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.tile:hover .tools,.tile:focus-within .tools{opacity:1}
.tile .tools button{width:24px;height:24px;border:0;border-radius:5px;background:rgba(22,23,26,.78);color:#fff;font:600 13px/1 var(--ui);cursor:pointer;padding:0}
.gridactions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn2{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:pointer}
.btn2:hover{border-color:var(--line-strong)}
@media (hover:none){.tile .tools{opacity:1}}

.tpls{display:flex;gap:0;margin:0 0 28px;padding:3px;border:0;background:var(--stage);border-radius:10px}
.tpls legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tpl{flex:1;font:inherit;color:var(--muted);background:transparent;border:0;border-radius:7px;padding:9px 6px;cursor:pointer;text-align:center;line-height:1.2}
.tpl b{display:block;font-weight:600;font-size:14.5px}
.tpl small{display:block;font-size:12px;margin-top:2px}
.tpl[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tpl[aria-pressed="true"] small{color:var(--muted)}

.field{margin:0 0 20px}
.field > label,.field > .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field .count{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.field .hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.field .warn{font-size:12.5px;margin:7px 0 0;padding:6px 9px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink);display:none}
.field .warn.on{display:block}
input[type=text],textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;resize:vertical}
input[type=text]:hover,textarea:hover{border-color:var(--line-strong)}
textarea{min-height:46px}
input[type=text].big{font-size:20px;font-weight:600}
:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline-offset:0;border-color:transparent}

.field > label.toggle{display:flex;justify-content:flex-start;align-items:center;gap:10px;margin:0;font-weight:500;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}

.drop{display:flex;align-items:center;justify-content:center;width:100%;min-height:80px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;padding:12px;text-align:center}
.drop:hover,.drop.over{border-color:var(--ink)}
.imgrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.imgrow img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.imgrow span{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{font:inherit;font-size:13.5px;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:4px}
.field > label.range{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:12px;font-size:13px;font-weight:400;margin:10px 0 0}
.range input{width:100%;accent-color:var(--accent)}

.actions{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.cta{width:100%;font:inherit;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r);padding:13px 18px;cursor:pointer}
.cta:hover{opacity:.9}
.cta:disabled{opacity:.55;cursor:progress}
.dlmsg{min-height:20px;font-size:13px;color:var(--muted);margin:12px 0 0}
.saved{font-size:12px;color:var(--muted);margin:6px 0 0}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 16px 40px;gap:20px}
  .top{padding:18px 16px 0}
  .stage{position:static;order:-1;padding:14px}
  .stage canvas{height:auto;width:100%}
}
</style>
</head>

  <h1>Generátor postů</h1>
</header>

<main class="app">
  <section class="controls" aria-label="Nastavení postu">
    <fieldset class="tpls" id="tpls">
      <legend>Šablona</legend>
    </fieldset>
    <div id="fields"></div>
    <div class="actions">
      <button class="cta" id="dl" type="button">Stáhnout PNG</button>
      <p class="dlmsg" id="dlmsg" role="status"></p>
      <p class="saved">Rozepsané texty si prohlížeč pamatuje i po zavření. Fotky ne.</p>
    </div>
  </section>

  <section class="stage" aria-label="Náhled">
    <div class="viewseg" role="group" aria-label="Typ náhledu">
      <button type="button" data-view="post" aria-pressed="true">Post</button>
      <button type="button" data-view="grid" aria-pressed="false">Grid profilu</button>
    </div>
    <div id="postview" class="view">
      <canvas id="post" width="1080" height="1350" role="img" aria-label="Náhled postu"></canvas>
      <p class="meta">Instagram post 4:5, export 1080 × 1350 px</p>
    </div>
    <div id="gridview" class="view" hidden>
      <div class="phone"><div class="grid" id="grid"></div></div>
      <div class="gridactions">
        <button type="button" class="btn2" id="pin">Přidat aktuální post do gridu</button>
        <button type="button" class="btn2" id="feedbtn">Nahrát posty z feedu</button>
        <input type="file" id="feedfile" accept="image/*" multiple hidden>
      </div>
      <p class="meta">Grid ořezává posty na 3:4, takže z každé strany zmizí kousek. Modře orámovaný je post, který právě upravuješ.</p>
    </div>
  </section>
</main>

<script>
/* ---------- brand ---------- */
const W = 1080, H = 1350, M = 88;
const INK = '#000102', BG = '#F5F5F5', YELLOW = '#FFEA00';
const COLORS = {
  yellow:{hex:'#FFEA00', name:'Žlutá'},
  blue:{hex:'#BFDFFC', name:'Světle modrá'},
  amber:{hex:'#FFB200', name:'Oranžová'},
  sage:{hex:'#9CAF8E', name:'Šalvějová'},
  lilac:{hex:'#C7B7FF', name:'Fialková'}
};
const HEAD = '"Stack Sans Headline","Helvetica Neue",Arial,sans-serif';
const TEXT = '"Stack Sans Text","Helvetica Neue",Arial,sans-serif';

function shade(hex, amt){ // darken + slight desaturate, for the bubble tail "fold"
  const n = parseInt(hex.slice(1),16);
  let r=n>>16&255,g=n>>8&255,b=n&255;
  const avg=(r+g+b)/3;
  r = r*(1-amt) + avg*amt*0.35; g = g*(1-amt) + avg*amt*0.35; b = b*(1-amt) + avg*amt*0.6;
  return `rgb(${r|0},${g|0},${b|0})`;
}
function font(ctx, weight, size, fam){ ctx.font = `${weight} ${size}px ${fam}`; }

/* ---------- drawing primitives ---------- */
function paper(ctx){
  ctx.fillStyle = BG; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(0,1,2,0.13)';
  const s = 30;
  for(let y = s/2; y < H; y += s) for(let x = s/2; x < W; x += s){
    ctx.beginPath(); ctx.arc(x,y,2.1,0,Math.PI*2); ctx.fill();
  }
}
function topBar(ctx){
  const h = 16, parts = [['#FFEA00',.36],['#BFDFFC',.30],['#FFB200',.34]];
  let x = 0;
  for(const [c,f] of parts){ ctx.fillStyle=c; ctx.fillRect(x,0,W*f+1,h); x += W*f; }
}
function wrap(ctx, text, maxW){
  const out = [];
  for(const raw of String(text).split('\n')){
    // Czech typography: one-letter prepositions/conjunctions never end a line
    const para = raw.replace(/(^|[ \t])([aikosuvzAIKOSUVZ])[ \t]+/g, '$1$2\u00A0').replace(/(^|[ \t])([aikosuvzAIKOSUVZ])[ \t]+/g, '$1$2\u00A0');
    const words = para.split(/[ \t]+/).filter(Boolean);
    if(!words.length){ out.push(''); continue; }
    let line = words[0];
    for(let i=1;i<words.length;i++){
      const t = line + ' ' + words[i];
      if(ctx.measureText(t).width <= maxW) line = t; else { out.push(line); line = words[i]; }
    }
    out.push(line);
  }
  while(out.length && out[out.length-1]==='') out.pop();
  return out;
}
function tooWide(ctx, lines, maxW){ return lines.some(l => ctx.measureText(l).width > maxW + 0.5); }
function capHeight(ctx){ return ctx.measureText('H').actualBoundingBoxAscent || parseFloat(ctx.font)*0.7; }

/* Angular chat bubble, tail hangs from the bottom-left corner (from the logo). */
function measureBubble(ctx, lines, size){
  font(ctx, 500, size, HEAD);
  const padX = size*0.38, padY = size*0.2, lh = size*1.12;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + padX*2;
  const boxH = padY*2 + lines.length*lh;
  return {w, boxH, tailH: boxH*0.26, padX, padY, lh};
}
function drawBubble(ctx, x, y, lines, size, color){
  const b = measureBubble(ctx, lines, size);
  const tw = Math.min(b.boxH*0.62, b.w*0.4);
  ctx.fillStyle = shade(color, .14);
  ctx.beginPath(); ctx.moveTo(x, y+b.boxH-1); ctx.lineTo(x+tw, y+b.boxH-1); ctx.lineTo(x, y+b.boxH+b.tailH); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(x, y, b.w, b.boxH);
  font(ctx, 500, size, HEAD);
  const cap = capHeight(ctx);
  ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic';
  lines.forEach((l,i) => ctx.fillText(l, x+b.padX, y + b.padY + i*b.lh + (b.lh+cap)/2));
  return {...b, h: b.boxH + b.tailH};
}
function placeholder(ctx, x, y, w, h, label){
  ctx.save();
  ctx.strokeStyle = 'rgba(0,1,2,.35)'; ctx.lineWidth = 3; ctx.setLineDash([14,10]);
  ctx.strokeRect(x+24, y+24, w-48, h-48);
  ctx.setLineDash([]);
  font(ctx, 400, 34, TEXT); ctx.fillStyle = 'rgba(0,1,2,.5)'; ctx.textAlign = 'center';
  ctx.fillText(label, x+w/2, y+h/2+12);
  ctx.restore();
}

function drawCover(ctx, img, x, y, w, h, d){
  const z = d.zoom/100;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const s = Math.max(w/img.width, h/img.height) * z;
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x + (w-dw)/2 + (d.ox/100)*((dw-w)/2), y + (h-dh)/2 + (d.oy/100)*((dh-h)/2), dw, dh);
  ctx.restore();
}

/* ---------- templates ---------- */
const TEMPLATES = {
  cislo: {
    label:'Číslo', sub:'velký údaj + bublina',
    defaults:{ number:'4,99%', bubble:'Nový spotřebitelský úvěr!', body:'', note:'', color:'yellow', bar:false },
    fields:[
      {key:'number', type:'text', big:true, label:'Číslo nebo krátký údaj', max:8, hint:'Sazba, částka, procento. Velikost se přizpůsobí šířce.'},
      {key:'bubble', type:'textarea', label:'Text v bublině', max:50, rows:2},
      {key:'body', type:'textarea', label:'Doplňující text', optional:true, max:150, rows:3},
      {key:'note', type:'textarea', label:'Poznámka pod čarou', optional:true, max:420, rows:3, hint:'U úvěrů sem patří reprezentativní příklad s RPSN.'},
      {key:'bar', type:'toggle', label:'Barevný pruh nahoře'}
    ],
    render(ctx, d, warn){
      paper(ctx); if(d.bar) topBar(ctx);
      const maxW = W - 2*M;
      const num = (d.number||'').trim() || ' ';

      // number: fit to width, capped
      font(ctx, 500, 400, HEAD);
      const nw = ctx.measureText(num).width || 1;
      const ns = Math.min(400, 400*maxW/nw);
      font(ctx, 500, ns, HEAD);
      const nm = ctx.measureText(num);
      const nAsc = nm.actualBoundingBoxAscent || ns*.72, nDesc = nm.actualBoundingBoxDescent || 0;
      if(ns < 170) warn('number','Údaj je dlouhý, číslo vyjde malé. Zkus ho zkrátit.');

      // bubble
      const bSize = 54;
      font(ctx, 500, bSize, HEAD);
      const bLines = (d.bubble||'').trim() ? wrap(ctx, d.bubble.trim(), maxW - bSize*0.76) : [];
      if(bLines.length > 2) warn('bubble','Nevejde se na 2 řádky, zkrať ho.');
      const bShown = bLines.slice(0,2);
      const bub = bShown.length ? measureBubble(ctx, bShown, bSize) : null;

      // body
      font(ctx, 400, 40, TEXT);
      const bodyLines = (d.body||'').trim() ? wrap(ctx, d.body.trim(), 820) : [];
      if(bodyLines.length > 4) warn('body','Max. 4 řádky, zkrať ho.');
      const bodyShown = bodyLines.slice(0,4);
      const bodyLh = 40*1.32;

      // footnote
      font(ctx, 400, 24, TEXT);
      const noteLines = (d.note||'').trim() ? wrap(ctx, d.note.trim(), maxW) : [];
      if(noteLines.length > 7) warn('note','Poznámka je moc dlouhá (max. 7 řádků).');
      const noteShown = noteLines.slice(0,7);
      const noteLh = 24*1.42;
      const noteH = noteShown.length ? noteShown.length*noteLh : 0;

      // vertical layout: center the block in the free area
      const gap1 = Math.max(26, ns*.1);
      const blockH = nAsc + nDesc + (bub ? gap1 + bub.boxH + bub.tailH : 0) + (bodyShown.length ? 60 + bodyShown.length*bodyLh : 0);
      const areaTop = d.bar ? 110 : 90;
      const areaBottom = H - M - (noteH ? noteH + 48 : 0);
      let y = areaTop + Math.max(0, (areaBottom - areaTop - blockH) * 0.46);

      font(ctx, 500, ns, HEAD); ctx.fillStyle = INK; ctx.textBaseline='alphabetic';
      ctx.fillText(num, M + (nm.actualBoundingBoxLeft||0), y + nAsc);
      y += nAsc + nDesc;
      if(bub){ y += gap1; drawBubble(ctx, M + ns*0.02, y, bShown, bSize, YELLOW); y += bub.boxH + bub.tailH; }
      if(bodyShown.length){
        y += 60; font(ctx, 400, 40, TEXT); ctx.fillStyle = INK;
        const cap = capHeight(ctx);
        bodyShown.forEach((l,i) => ctx.fillText(l, M, y + i*bodyLh + cap));
      }
      if(noteShown.length){
        font(ctx, 400, 24, TEXT); ctx.fillStyle = 'rgba(0,1,2,.62)';
        const top = H - M - noteH;
        noteShown.forEach((l,i) => ctx.fillText(l, M, top + i*noteLh + noteLh*0.75));
      }
    }
  },

  mytus: {
    label:'Mýtus', sub:'tvrzení + klíčové slovo',
    defaults:{ head:'Nepotřebuji', bubble:'havarijní pojištění', color:'yellow', bar:true, img:null, imgName:'', mode:'cover', zoom:100, ox:0, oy:0 },
    fields:[
      {key:'head', type:'textarea', label:'Tvrzení', max:26, rows:2, hint:'Krátce, max. 2 řádky. Enter zalomí řádek.'},
      {key:'bubble', type:'textarea', label:'Klíčové slovo v bublině', max:40, rows:2},
      {key:'img', type:'image', label:'Fotka dole'},
      {key:'bar', type:'toggle', label:'Barevný pruh nahoře'}
    ],
    render(ctx, d, warn, preview){
      paper(ctx); if(d.bar) topBar(ctx);
      const maxW = W - 2*M;
      let y = d.bar ? 150 : 128;

      // headline
      const hs = 132, hlh = hs*1.02;
      font(ctx, 500, hs, HEAD);
      const hl = (d.head||'').trim() ? wrap(ctx, d.head.trim(), maxW) : [];
      if(hl.length > 2) warn('head','Nevejde se na 2 řádky, zkrať ho.');
      else if(tooWide(ctx, hl, maxW)) warn('head','Slovo je moc dlouhé na šířku postu.');
      const hShown = hl.slice(0,2);
      const cap = capHeight(ctx);
      ctx.fillStyle = INK; ctx.textBaseline='alphabetic';
      hShown.forEach((l,i) => ctx.fillText(l, M - 4, y + cap + i*hlh));
      if(hShown.length) y += cap + (hShown.length-1)*hlh + hs*0.26;

      // bubble
      const bs = 66;
      font(ctx, 500, bs, HEAD);
      const bl = (d.bubble||'').trim() ? wrap(ctx, d.bubble.trim(), maxW - 40 - bs*0.76) : [];
      if(bl.length > 2) warn('bubble','Nevejde se na 2 řádky, zkrať ho.');
      const bShown = bl.slice(0,2);
      if(bShown.length){ y += 34; const b = drawBubble(ctx, M, y, bShown, bs, YELLOW); y += b.h; }

      // image area
      const top = Math.max(y + 70, 660), ah = H - top;
      const img = d.img && IMAGES[d.img];
      if(img){
        drawCover(ctx, img, 0, top, W, ah, d);
      } else if(preview){
        placeholder(ctx, 0, top, W, ah, 'Sem přijde fotka');
      }
    }
  },

  foto: {
    label:'Foto', sub:'fotka + titulek',
    defaults:{ yellow:'Hypotéka a smlouva na dobu', white:'neurčitou.', bar:true, img:null, imgName:'', mode:'cover', zoom:100, ox:0, oy:0, dark:35 },
    fields:[
      {key:'img', type:'image', label:'Fotka'},
      {key:'yellow', type:'textarea', label:'Titulek – žlutá část', max:40, rows:2},
      {key:'white', type:'textarea', label:'Dokončení bílou', optional:true, max:24, rows:1, hint:'Začíná vždy na novém řádku. Celkem max. 5 řádků, Enter zalomí řádek ručně.'},
      {key:'dark', type:'slider', label:'Ztmavení fotky dole', min:0, max:100},
      {key:'bar', type:'toggle', label:'Barevný pruh nahoře'}
    ],
    render(ctx, d, warn, preview){
      const img = d.img && IMAGES[d.img];
      if(img) drawCover(ctx, img, 0, 0, W, H, d);
      else {
        ctx.fillStyle = '#3A3B3D'; ctx.fillRect(0,0,W,H);
        if(preview){
          ctx.save(); ctx.strokeStyle='rgba(245,245,245,.35)'; ctx.lineWidth=3; ctx.setLineDash([14,10]);
          ctx.strokeRect(48,64,W-96,H-112); ctx.setLineDash([]);
          font(ctx,400,34,TEXT); ctx.fillStyle='rgba(245,245,245,.6)'; ctx.textAlign='center';
          ctx.fillText('Sem přijde fotka', W/2, H*0.36); ctx.restore();
        }
      }
      // bottom darkening for legibility
      const a = d.dark/100;
      if(a > 0){
        const g = ctx.createLinearGradient(0, H*0.35, 0, H);
        g.addColorStop(0,'rgba(0,1,2,0)'); g.addColorStop(0.55,`rgba(0,1,2,${0.45*a})`); g.addColorStop(1,`rgba(0,1,2,${0.8*a})`);
        ctx.fillStyle = g; ctx.fillRect(0, H*0.35, W, H*0.65);
      }
      if(d.bar) topBar(ctx);

      const size = 108, lh = size*1.06, maxW = 620;
      font(ctx, 400, size, HEAD);
      const yl = (d.yellow||'').trim() ? wrap(ctx, d.yellow.trim(), maxW) : [];
      const wl = (d.white||'').trim() ? wrap(ctx, d.white.trim(), maxW) : [];
      let lines = [...yl.map(t=>[t,YELLOW]), ...wl.map(t=>[t,'#FFFFFF'])];
      if(lines.length > 5){ warn(wl.length ? 'white' : 'yellow', 'Titulek má víc než 5 řádků, zkrať ho.'); lines = lines.slice(0,5); }
      if(tooWide(ctx, lines.map(l=>l[0]), maxW)) warn('yellow','Některé slovo je moc dlouhé na šířku.');
      const lastBase = H - 104;
      ctx.textBaseline = 'alphabetic';
      lines.forEach(([t,c], i) => {
        ctx.fillStyle = c;
        ctx.fillText(t, M - 4, lastBase - (lines.length-1-i)*lh);
      });
    }
  }
};

/* ---------- state ---------- */
const IMAGES = {}; // id -> HTMLImageElement (not persisted)
const STORE_KEY = 'fsh-generator-v2';
let state = { tpl:'cislo', data:{} };
for(const k in TEMPLATES) state.data[k] = {...TEMPLATES[k].defaults};
try{
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if(saved && saved.data){
    if(TEMPLATES[saved.tpl]) state.tpl = saved.tpl;
    for(const k in TEMPLATES) Object.assign(state.data[k], saved.data[k]||{}, {img:null, imgName:''});
  }
}catch(e){}
function persist(){
  try{
    const data = {};
    for(const k in state.data){ const {img, imgName, ...rest} = state.data[k]; data[k] = rest; }
    localStorage.setItem(STORE_KEY, JSON.stringify({tpl:state.tpl, data}));
  }catch(e){}
}

/* ---------- UI ---------- */
const $tpls = document.getElementById('tpls');
const $fields = document.getElementById('fields');
const canvas = document.getElementById('post');
const ctx = canvas.getContext('2d');

function renderTabs(){
  $tpls.querySelectorAll('.tpl').forEach(b => b.remove());
  for(const [key,t] of Object.entries(TEMPLATES)){
    const b = document.createElement('button');
    b.type='button'; b.className='tpl'; b.setAttribute('aria-pressed', String(key===state.tpl));
    b.innerHTML = `<b></b>`; b.title = t.sub;
    b.querySelector('b').textContent = t.label;
    b.onclick = () => { state.tpl = key; persist(); renderTabs(); renderFields(); draw(); };
    $tpls.appendChild(b);
  }
}

function el(tag, attrs={}, kids=[]){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k.startsWith('on')) e[k]=v; else e.setAttribute(k,v);
  }
  for(const c of [].concat(kids)) if(c) e.appendChild(c);
  return e;
}

function renderFields(){
  const t = TEMPLATES[state.tpl], d = state.data[state.tpl];
  $fields.innerHTML = '';
  for(const f of t.fields){
    const id = `f-${state.tpl}-${f.key}`;
    const wrapEl = el('div',{class:'field'});
    if(f.type==='text' || f.type==='textarea'){
      const count = el('span',{class:'count'});
      const lab = el('label',{for:id},[document.createTextNode(f.label + (f.optional?' (nepovinné)':'')), count]);
      const inp = f.type==='text' ? el('input',{type:'text',id, class:f.big?'big':''}) : el('textarea',{id, rows:String(f.rows||2)});
      inp.value = d[f.key] || '';
      const upd = () => { count.textContent = `${inp.value.length} / ${f.max}`; count.style.color = inp.value.length > f.max ? '#B34700' : ''; };
      inp.oninput = () => { d[f.key] = inp.value; upd(); persist(); draw(); };
      upd();
      wrapEl.append(lab, inp);
      if(f.hint) wrapEl.append(el('p',{class:'hint',text:f.hint}));
      wrapEl.append(el('p',{class:'warn','data-warn':f.key, role:'status'}));
    }
    else if(f.type==='color'){
      wrapEl.append(el('div',{class:'lbl',id:id+'-l',text:f.label}));
      const row = el('div',{class:'swatches',role:'radiogroup','aria-labelledby':id+'-l'});
      for(const [ck,c] of Object.entries(COLORS)){
        const b = el('button',{type:'button',class:'sw',role:'radio','aria-checked':String(d.color===ck),'aria-label':c.name,title:c.name});
        b.style.background = c.hex;
        b.onclick = () => { d.color = ck; persist(); renderFields(); draw(); };
        row.append(b);
      }
      wrapEl.append(row);
    }
    else if(f.type==='toggle'){
      const cb = el('input',{type:'checkbox',id});
      cb.checked = !!d[f.key];
      cb.onchange = () => { d[f.key] = cb.checked; persist(); draw(); };
      wrapEl.append(el('label',{class:'toggle',for:id},[cb, document.createTextNode(f.label)]));
    }
    else if(f.type==='slider'){
      const r = el('input',{type:'range',min:String(f.min),max:String(f.max),value:String(d[f.key]),id});
      r.oninput = () => { d[f.key] = +r.value; persist(); draw(); };
      wrapEl.append(el('label',{class:'range',for:id},[document.createTextNode(f.label), r]));
    }
    else if(f.type==='image'){
      wrapEl.append(el('div',{class:'lbl',text:f.label}));
      const file = el('input',{type:'file',accept:'image/*',hidden:''});
      file.onchange = () => file.files[0] && loadImage(file.files[0]);
      if(d.img && IMAGES[d.img]){
        const row = el('div',{class:'imgrow'});
        const th = el('img',{alt:''}); th.src = IMAGES[d.img].src;
        row.append(th, el('span',{text:d.imgName}),
          el('button',{type:'button',class:'linkbtn',text:'Vyměnit',onclick:()=>file.click()}),
          el('button',{type:'button',class:'linkbtn',text:'Odebrat',onclick:()=>{ d.img=null; d.imgName=''; renderFields(); draw(); }}));
        wrapEl.append(row);
        if(f.modes){
        const seg = el('div',{class:'seg'});
        [['cover','Fotka přes celou šířku'],['object','Objekt bez pozadí']].forEach(([m,l])=>{
          seg.append(el('button',{type:'button','aria-pressed':String(d.mode===m),text:l,onclick:()=>{ d.mode=m; persist(); renderFields(); draw(); }}));
        });
        wrapEl.append(seg);
        }
        const range = (key,label,min,max) => {
          const r = el('input',{type:'range',min:String(min),max:String(max),value:String(d[key]),id:id+key,'aria-label':label});
          r.oninput = () => { d[key] = +r.value; persist(); draw(); };
          return el('label',{class:'range',for:id+key},[document.createTextNode(label), r]);
        };
        wrapEl.append(range(f.modes?'zoom':'zoom','Velikost',f.modes?60:100,250), range('ox','Posun do stran',-100,100), range('oy','Posun nahoru/dolů',-100,100));
        if(f.modes) wrapEl.append(el('p',{class:'hint',text:'„Objekt bez pozadí“ je pro PNG s průhledností, třeba auto nebo dům.'}));
      } else {
        const drop = el('button',{type:'button',class:'drop',text:'Nahrát fotku nebo ji sem přetáhnout',onclick:()=>file.click()});
        drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
        drop.ondragleave = () => drop.classList.remove('over');
        drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f0 = e.dataTransfer.files[0]; if(f0) loadImage(f0); };
        wrapEl.append(drop);
      }
      wrapEl.append(file);
    }
    $fields.append(wrapEl);
  }
  draw();
}

function loadImage(fileObj){
  if(!fileObj.type.startsWith('image/')){ flash('Tenhle soubor není obrázek. Nahraj JPG, PNG nebo WebP.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const id = 'i'+Date.now();
      IMAGES[id] = img;
      const d = state.data[state.tpl];
      d.img = id; d.imgName = fileObj.name; d.zoom = 100; d.ox = 0; d.oy = 0;
      renderFields();
    };
    img.onerror = () => flash('Obrázek se nepodařilo načíst. Zkus jiný soubor.');
    img.src = reader.result;
  };
  reader.readAsDataURL(fileObj);
}

/* ---------- render ---------- */
function renderTo(c, preview){
  const warnings = {};
  const k = c.getContext('2d');
  k.save(); k.textAlign='left';
  TEMPLATES[state.tpl].render(k, state.data[state.tpl], (key,msg)=>{ warnings[key]=msg; }, preview);
  k.restore();
  return warnings;
}
function draw(){
  const w = renderTo(canvas, true);
  if(view === 'grid' && liveTile) liveTile.getContext('2d').drawImage(canvas, 0, 0, liveTile.width, liveTile.height);
  document.querySelectorAll('[data-warn]').forEach(p => {
    const m = w[p.dataset.warn]; p.textContent = m || ''; p.classList.toggle('on', !!m);
  });
}

/* ---------- download ---------- */
const $dl = document.getElementById('dl'), $msg = document.getElementById('dlmsg');
let downloads = null;
function flash(t){ $msg.textContent = t; }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
$dl.onclick = async () => {
  $dl.disabled = true; flash('');
  try{
    const out = document.createElement('canvas'); out.width=W; out.height=H;
    renderTo(out, false);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    const filename = `finance-s-honzou_${state.tpl}_${stamp()}.png`;
    if(downloads){
      try{ await downloads.save({filename, data:blob}); flash('Post je stažený.'); }
      catch(e){
        if(e && e.code==='declined') flash('Stahování zrušeno.');
        else if(e && e.code==='rate_limited') flash('Potvrzovací okno už je otevřené.');
        else flash('Stažení se nepovedlo. Zkus to znovu.');
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      flash('Pokud se stahování nespustilo, klikni pravým tlačítkem na náhled a zvol Uložit obrázek.');
    }
  } finally { $dl.disabled = false; }
};

/* ---------- grid preview ---------- */
const GRID_KEY = 'fsh-grid-v1';
let view = 'post', liveTile = null, GRID = [];
try{ GRID = JSON.parse(localStorage.getItem(GRID_KEY) || '[]') || []; }catch(e){ GRID = []; }
function persistGrid(){
  try{ localStorage.setItem(GRID_KEY, JSON.stringify(GRID)); return true; }
  catch(e){ flash('Prohlížeč už nemá místo na další obrázky v gridu. Odeber pár starších.'); return false; }
}
function toThumb(src, w=432, h=540){ // centre-crop to 4:5, small JPEG for storage
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const k = c.getContext('2d');
  const sw = src.width, sh = src.height, s = Math.max(w/sw, h/sh);
  k.fillStyle = '#fff'; k.fillRect(0,0,w,h);
  k.drawImage(src, (w-sw*s)/2, (h-sh*s)/2, sw*s, sh*s);
  return c.toDataURL('image/jpeg', 0.86);
}
function renderGrid(){
  const g = document.getElementById('grid'); g.innerHTML = '';
  const live = el('div',{class:'tile live',title:'Právě upravovaný post'});
  liveTile = document.createElement('canvas'); liveTile.width = 360; liveTile.height = 450;
  live.append(liveTile); g.append(live);
  GRID.forEach((item, i) => {
    const t = el('div',{class:'tile'});
    const im = el('img',{alt:'Post v gridu '+(i+2)}); im.src = item.src;
    const tools = el('div',{class:'tools'});
    const move = (dir) => { const j = i+dir; if(j<0||j>=GRID.length) return; [GRID[i],GRID[j]]=[GRID[j],GRID[i]]; persistGrid(); renderGrid(); };
    if(i>0) tools.append(el('button',{type:'button','aria-label':'Posunout dopředu',title:'Posunout dopředu',text:'←',onclick:()=>move(-1)}));
    if(i<GRID.length-1) tools.append(el('button',{type:'button','aria-label':'Posunout dozadu',title:'Posunout dozadu',text:'→',onclick:()=>move(1)}));
    tools.append(el('button',{type:'button','aria-label':'Odebrat z gridu',title:'Odebrat',text:'×',onclick:()=>{ GRID.splice(i,1); persistGrid(); renderGrid(); }}));
    t.append(im, tools); g.append(t);
  });
  const total = Math.max(9, Math.ceil((GRID.length+1)/3)*3);
  for(let i = GRID.length+1; i < total; i++) g.append(el('div',{class:'tile','aria-hidden':'true'}));
  draw();
}
document.querySelectorAll('.viewseg button').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll('.viewseg button').forEach(x => x.setAttribute('aria-pressed', String(x===b)));
  document.getElementById('postview').hidden = view !== 'post';
  document.getElementById('gridview').hidden = view !== 'grid';
  if(view === 'grid') renderGrid();
});
document.getElementById('pin').onclick = () => {
  const out = document.createElement('canvas'); out.width=W; out.height=H; renderTo(out, false);
  GRID.unshift({id:'g'+Date.now(), src:toThumb(out)});
  if(GRID.length > 24) GRID.length = 24;
  if(persistGrid()) flash('Post je v gridu. Dál můžeš upravovat nový.');
  renderGrid();
};
const feedfile = document.getElementById('feedfile');
document.getElementById('feedbtn').onclick = () => feedfile.click();
feedfile.onchange = async () => {
  for(const f of [...feedfile.files]){
    if(!f.type.startsWith('image/')) continue;
    const url = URL.createObjectURL(f);
    const img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = url; });
    URL.revokeObjectURL(url);
    if(img) GRID.push({id:'g'+Date.now()+Math.random().toString(36).slice(2,6), src:toThumb(img)});
  }
  feedfile.value = '';
  if(GRID.length > 24) GRID.length = 24;
  persistGrid(); renderGrid();
};

/* ---------- boot ---------- */
renderTabs(); renderFields();
const sample = 'ěščřžýáíéůúťďňĚŠČŘŽÝÁÍÉŮÚ 0123456789%';
Promise.all([
  document.fonts.load(`500 100px "Stack Sans Headline"`, sample),
  document.fonts.load(`400 40px "Stack Sans Text"`, sample),
  document.fonts.load(`500 40px "Stack Sans Text"`, sample)
]).catch(()=>{}).finally(draw);
document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', draw);

if(window.claude && typeof window.claude.use === 'function'){
  window.claude.use('downloads').then(ns => { downloads = ns; }).catch(()=>{});
}
</script>
